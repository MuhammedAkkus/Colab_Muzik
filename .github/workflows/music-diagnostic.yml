name: Music engine diagnostic
on:
  workflow_dispatch:
    inputs:
      test:
        description: 'Probe connection or render the preserved complete arrangement'
        type: choice
        options:
          - probe
          - arranged
        default: probe
permissions:
  contents: write
concurrency:
  group: daily-music-catalog
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Probe actual audio
        id: probe
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEST: ${{ inputs.test }}
        run: python diagnose.py diagnostics/${{ github.run_id }} "$TEST"
      - name: Archive diagnostic evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics
          if ! git diff --cached --quiet; then
            git commit -m 'Archive bounded music-engine diagnostic'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: music-diagnostic-${{ github.run_id }}
          path: diagnostics/${{ github.run_id }}/
          retention-days: 1
      - if: steps.probe.outcome == 'failure'
        run: exit 1
